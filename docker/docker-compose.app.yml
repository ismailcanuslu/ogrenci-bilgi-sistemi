      OpenTelemetry__ServiceName: "obs-notifications-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://obs-jaeger:4317}
      Notifications__Provider: ${NOTIFICATIONS_PROVIDER:-Console}
      # Notifications__Smtp__Host: obs-mailpit
      # Notifications__Smtp__Port: ${SMTP_PORT:-1025}
      # Notifications__Smtp__EnableSsl: "false"
      # Notifications__Smtp__FromEmail: ${SMTP_FROM_EMAIL:-noreply@example.com}
      # Notifications__Smtp__FromName: ${SMTP_FROM_NAME:-OBS Platform}
      Notifications__Branding__CompanyName: ${BRANDING_COMPANY_NAME:-OBS Platform}
      Notifications__Branding__LogoUrl: ${BRANDING_LOGO_URL:-https://example.com/logo.png}
      Notifications__Branding__SupportUrl: ${BRANDING_SUPPORT_URL:-https://support.example.com}
      Notifications__Branding__SupportEmail: ${BRANDING_SUPPORT_EMAIL:-support@example.com}
      Notifications__Branding__CompanyAddress: ${BRANDING_COMPANY_ADDRESS:-Example University Kampus}
      Notifications__Branding__PrimaryColor: ${BRANDING_PRIMARY_COLOR:-#6166BE}
      Notifications__Branding__AccentColor: ${BRANDING_ACCENT_COLOR:-#F0F0F9}
      Notifications__Branding__DefaultTheme: ${BRANDING_DEFAULT_THEME:-ModernCard}
      Notifications__Sms__Provider: ${SMS_PROVIDER:-Console}
      Notifications__Sms__SenderHeader: ${SMS_SENDER_HEADER:-OBSPLATFORM}
      Notifications__Sms__EndpointUrl: ${SMS_ENDPOINT_URL:-https://api.sms-provider.example.com/v1/send}
      Notifications__Sms__ApiKey: ${SMS_API_KEY:-example-api-key}
      Notifications__Sms__ApiSecret: ${SMS_API_SECRET:-}
