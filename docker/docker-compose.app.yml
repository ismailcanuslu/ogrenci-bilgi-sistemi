      OpenTelemetry__ServiceName: "obs-files-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://obs-jaeger:4317}
      Files__Storage__Provider: ${FILES_STORAGE_PROVIDER:-Local}
      Files__Storage__BasePath: ${FILES_STORAGE_BASE_PATH:-uploads}
      # Files__Storage__S3__ServiceUrl: http://obs-minio:9000
      # Files__Storage__S3__BucketName: ${MINIO_BUCKET_NAME:-obs-files}
      # Files__Storage__S3__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      # Files__Storage__S3__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Files__Storage__S3__Region: ${MINIO_REGION:-eu-central-1}
      # Files__Storage__S3__ForcePathStyle: "true"
      Files__Validation__MaxFileSizeInBytes: ${FILES_MAX_SIZE_BYTES:-52428800}
      Files__Security__EnforceAuthorization: ${FILES_ENFORCE_AUTH:-false}
      Files__Security__AllowAnonymousRead: "false"
      Files__Security__AdminRoleName: "Admin"
    networks:
      - obs-network

