  # ==========================================
  # 11. React Web App SPA (Ant Design Frontend)
  # ==========================================
  obs-react-spa:
    build:
      context: ..
      dockerfile: docker/Dockerfile.react-spa
    container_name: obs-react-spa
    restart: always
    ports:
      - "${SPA_PORT:-3000}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5050}
    depends_on:
      - obs-bootstrapper
    networks:
      - obs-network

networks:
  obs-network:
    name: obs-network
    driver: bridge
