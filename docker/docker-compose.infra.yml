services:
  obs-sqlserver:
    image: ${MSSQL_CONTAINER_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: ${MSSQL_CONTAINER_NAME:-obs-sqlserver}
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Password123!}
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - obs_sqldata:/var/opt/mssql
    networks:
      - obs-network

