  obs-redis:
    image: ${REDIS_CONTAINER_IMAGE:-redis:alpine}
    container_name: ${REDIS_CONTAINER_NAME:-obs-redis}
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - obs_redisdata:/data
    networks:
      - obs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

